name: Validate

on:
  push:
    branches:
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck and build
        run: pnpm build

  dataset-tools:
    name: Dataset tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: python -m py_compile tools/dataset/*.py tools/dataset/tests/*.py

      - name: Unit tests
        run: python -m unittest discover -s tools/dataset/tests -p "test_*.py" -v

      - name: Validate source metadata
        run: python tools/dataset/check_source_metadata.py

  rust:
    name: Rust check (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Rust backend
        run: cargo check --manifest-path src-tauri/Cargo.toml
